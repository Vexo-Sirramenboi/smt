
name: Download Google Apps Script HTML

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  download-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download HTML
        run: |
          curl -fLsS \
            "https://script.google.com/macros/s/AKfycbxyhy_leO9Ld19yVy9O0-cs-d7Z-mbeJZXdqgzAySaPb98tNF9FaV_mfMH0qJucHhgZ/exec" \
            -o index.html

      - name: Check downloaded file
        run: |
          test -s index.html
          head -c 200 index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update downloaded HTML"
            git push
          else
            echo "No changes to commit"
          fi
