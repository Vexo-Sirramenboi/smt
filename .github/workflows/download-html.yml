
name: Collect Website Dependencies

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Download website HTML
        run: |
          mkdir -p site
          python - <<'PY'
          import requests

          url = "https://storage.googleapis.com/yubico/study.html"
          response = requests.get(url, timeout=30)
          response.raise_for_status()

          with open("site/study.html", "wb") as f:
              f.write(response.content)

          print("Downloaded HTML:", len(response.content), "bytes")
          PY

      - name: Upload collected files
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: site/
          if-no-files-found: error
